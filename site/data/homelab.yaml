# Contenu de la page d'accueil. Règle du dépôt public : ni adresse IP, ni VLAN, ni version, ni procédure d'accès.
# Ton : première personne, faits vérifiables, pas de slogan.

presentation:
  titre: Le homelab de Maxime Bertrand
  paragraphes:
    - >-
      Je suis administrateur systèmes et réseaux. À la maison, un Dell PowerEdge T330 héberge les photos et les
      fichiers de ma famille, avec ce qu'il faut autour : pare-feu, annuaire, supervision et sauvegardes.
    - >-
      Je le tiens comme un système en production. Les machines, le pare-feu et le DNS sont décrits en code, chaque
      choix structurant fait l'objet d'une décision écrite, et le journal garde la trace de ce qui a cassé. Ce site
      est généré à partir de cette documentation, et servi par le homelab lui-même.

en_bref:
  - terme: Matériel
    detail: Un seul serveur, Dell PowerEdge T330. Stockage ZFS en RAIDZ2 (deux disques peuvent lâcher sans perte).
  - terme: Réseau
    detail: OPNsense virtualisé. Sept zones, tout est interdit entre elles par défaut. Administration par VPN uniquement.
  - terme: Services
    detail: Photos (Immich), fichiers (Nextcloud), connexion unique avec double authentification (Authelia, LLDAP).
  - terme: Code
    detail: OpenTofu pour les machines, le pare-feu et le DNS ; Ansible pour la configuration ; secrets chiffrés (SOPS, OpenBao).
  - terme: Sauvegardes
    detail: Instantanés ZFS sur place, copie chiffrée hors site, dont une partie est relue et vérifiée chaque jour.
  - terme: Supervision
    detail: Prometheus et Alertmanager, journaux centralisés, alertes sur téléphone et veille des failles de sécurité.

requete:
  intro: Ce que traverse une requête venue d'Internet vers les photos ou les fichiers.
  etapes:
    - { nom: Internet, detail: "Un seul port entrant, rien d'autre n'est ouvert." }
    - { nom: Pare-feu, detail: "OPNsense ne transmet qu'au WAF, et isole chaque zone de ses voisines." }
    - { nom: WAF, detail: "BunkerWeb et CrowdSec : règles OWASP, filtrage par pays, limite de débit, bannissements." }
    - { nom: Portail, detail: "Authelia vérifie la session et le second facteur ; l'annuaire décide des droits." }
    - { nom: Application, detail: "Dans sa propre zone, sans accès au reste du réseau." }

principes:
  - titre: Tout en code.
    texte: >-
      Aucune machine, règle de pare-feu ou entrée DNS n'est créée à la main. Relancer OpenTofu ou Ansible sur un
      système à jour ne doit rien changer.
  - titre: Exposer le moins possible.
    texte: >-
      Seuls les services de la famille sont publiés, derrière le WAF et le portail. Les outils d'administration ne
      sont joignables que par le VPN.
  - titre: Cloisonner.
    texte: >-
      Chaque service vit dans sa zone. Un flux entre deux zones n'existe que s'il est écrit, avec sa raison, dans
      la matrice des flux.
  - titre: Pouvoir tout reconstruire.
    texte: >-
      Sauvegardes hors site, secrets versionnés, procédures écrites : la remise en route ne dépend ni de ma
      mémoire, ni de ma présence.

