<header class="entete">
  <div class="enveloppe entete__barre">
    <a class="marque" href="{{ "/" | relURL }}" aria-label="Accueil">
      <span class="marque__logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M8 22V10l8 7 8-7v12"/></svg>
      </span>
      <span class="marque__nom">maxime<span class="marque__point">.</span>bertrand</span>
      <span class="marque__tag">homelab</span>
    </a>
    <nav class="navigation" aria-label="Navigation principale">
      {{ $courant := . }}
      {{ range slice "architecture" "adr" "journal" }}
        {{ with site.GetPage (printf "/%s" .) }}
          <a href="{{ .RelPermalink }}" {{ if or (eq $courant .) ($courant.IsDescendant .) }}aria-current="page"{{ end }}>{{ if eq .Section "adr" }}Décisions{{ else }}{{ .Title }}{{ end }}</a>
        {{ end }}
      {{ end }}
      <a class="navigation__externe" href="{{ site.Params.depot }}" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
      <button class="bascule-theme" type="button" aria-label="Changer de thème (clair / sombre)">
        <svg class="icone-lune" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icone-soleil" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
