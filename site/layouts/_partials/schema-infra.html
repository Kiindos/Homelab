{{/* Schéma de l'infrastructure, dessiné à la main. Règle du dépôt public : ni adresse, ni VLAN, ni version.
     Mêmes zones que la page « Réseau ». Couleurs : classes .infra de site.css (thèmes clair et sombre). */}}
<svg class="infra" viewBox="0 0 400 556" role="img" aria-labelledby="infra-titre infra-desc">
  <title id="infra-titre">Schéma du homelab</title>
  <desc id="infra-desc">Depuis Internet, la Freebox transmet au pare-feu OPNsense, sur le serveur Dell T330. Le pare-feu isole
    quatre zones : la DMZ (WAF et site vitrine), l'identité (portail SSO), les services personnels (photos et
    fichiers) et l'administration, joignable par VPN seulement. Le site vitrine sort par un tunnel Cloudflare. Les
    données, sur ZFS en RAIDZ2, sont sauvegardées chiffrées hors site chaque nuit.</desc>
  <defs>
    <marker id="infra-pointe" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="pointe" d="M0 0 L8 4 L0 8 z"/>
    </marker>
    <marker id="infra-pointe-vpn" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="pointe pointe--vpn" d="M0 0 L8 4 L0 8 z"/>
    </marker>
  </defs>

  <!-- Hors du serveur -->
  <rect class="boite boite--legere" x="10" y="10" width="110" height="34" rx="4"/>
  <text class="t-titre" x="65" y="31" text-anchor="middle">Cloudflare</text>
  <rect class="boite" x="140" y="10" width="120" height="34" rx="17"/>

  <rect class="cadre" x="10" y="132" width="380" height="358" rx="6"/>
