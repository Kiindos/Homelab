# L'inventaire réel est tenu dans le dépôt privé (passé avec -i) ; voir inventory/hosts.yml.example.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Connexion coupée (VPN relancé, réseau) : abandon au bout d'une minute au lieu d'attendre indéfiniment.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
