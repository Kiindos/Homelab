# Hyperviseur Proxmox : durcissement commun + configuration propre à Proxmox.
- name: Charger les secrets (SOPS ou coffre OpenBao, selon secrets_source)
  hosts: hyperviseurs
  gather_facts: false
  roles:
    - secrets

- name: Configurer l'hyperviseur
  hosts: hyperviseurs
  become: false
  roles:
    - role: common
      vars:
        # needrestart pourrait redémarrer des services Proxmox en pleine journée : exclu ici.
        common_paquets: [curl, vim, htop, jq, ca-certificates, unattended-upgrades, apt-listchanges, smartmontools]
    - hyperviseur
    - role: agent_supervision
      vars:
        agent_supervision_smart: true
    # Mise à jour du parc : paquets Proxmox et Debian ; jamais de redémarrage automatique (toutes les VM s'arrêteraient).
    - role: mises_a_jour
      vars:
        mise_a_jour_redemarrage: jamais
        mise_a_jour_images: false
    - role: sauvegarde
      when: sauvegarde_active | default(false) | bool
