- name: Créer le dossier de la pile WAF
  ansible.builtin.file:
    path: "{{ waf_dossier }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Créer le dossier des pages d'erreur
  ansible.builtin.file:
    path: "{{ waf_dossier }}/erreurs"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Générer les pages d'erreur personnalisées
  ansible.builtin.template:
    src: erreur.html.j2
    dest: "{{ waf_dossier }}/erreurs/{{ code }}.html"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ waf_erreurs.keys() | list }}"
  loop_control:
    loop_var: code

- name: Déposer les fichiers de la charte (habillage du portail d'authentification)
  ansible.builtin.copy:
    src: charte/
    dest: "{{ waf_dossier }}/charte/"
    owner: root
    group: root
    mode: "u=rwX,go=rX"

- name: Déposer la liste blanche CrowdSec (faux positifs des applications)
  ansible.builtin.template:
    src: crowdsec-liste-blanche.yaml.j2
    dest: "{{ waf_dossier }}/crowdsec-liste-blanche.yaml"
    owner: root
    group: root
    mode: "0644"
  register: waf_liste_blanche

- name: Déposer le fichier Compose de BunkerWeb
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ waf_dossier }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: waf_compose

- name: Démarrer BunkerWeb
  community.docker.docker_compose_v2:
    project_src: "{{ waf_dossier }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if waf_compose.changed else 'auto' }}"

# --- Liste blanche CrowdSec ------------------------------------------------------------------------
# Pas de montage : Docker créerait /etc/crowdsec/parsers en root, et CrowdSec (non privilégié) ne pourrait plus y
# installer ses composants au démarrage (constaté le 27/09 : CrowdSec arrêté, WebSocket refusés). Le fichier est
# copié une fois CrowdSec prêt, puis CrowdSec relit sa configuration.

- name: Attendre que CrowdSec ait installé ses composants
  ansible.builtin.command: docker exec waf-bunkerweb-1 test -d /etc/crowdsec/parsers/s02-enrich
  register: waf_crowdsec_pret
  until: waf_crowdsec_pret.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Lire la liste blanche en place dans CrowdSec
  ansible.builtin.command: docker exec waf-bunkerweb-1 cat /etc/crowdsec/parsers/s02-enrich/homelab-liste-blanche.yaml
  register: waf_liste_blanche_actuelle
  changed_when: false
  failed_when: false

- name: Lire la liste blanche voulue
  ansible.builtin.slurp:
    src: "{{ waf_dossier }}/crowdsec-liste-blanche.yaml"
  register: waf_liste_blanche_voulue

- name: Installer la liste blanche dans CrowdSec
  ansible.builtin.command: >-
    docker cp {{ waf_dossier }}/crowdsec-liste-blanche.yaml
    waf-bunkerweb-1:/etc/crowdsec/parsers/s02-enrich/homelab-liste-blanche.yaml
  when: waf_liste_blanche_actuelle.stdout | trim != waf_liste_blanche_voulue.content | b64decode | trim
  changed_when: true
  notify: Recharger CrowdSec

- name: Appliquer le rechargement de CrowdSec avant la vérification
  ansible.builtin.meta: flush_handlers

- name: Vérifier que l'API locale de CrowdSec répond
  ansible.builtin.command: docker exec waf-bunkerweb-1 cscli lapi status
  register: waf_crowdsec_lapi
  until: waf_crowdsec_lapi.rc == 0
  # Conteneur recréé : CrowdSec retélécharge ses règles avant d'ouvrir son API (plusieurs minutes).
  retries: 60
  delay: 5
  changed_when: false
