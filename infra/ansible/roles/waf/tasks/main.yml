- name: Créer le dossier de la pile WAF
  ansible.builtin.file:
    path: "{{ waf_dossier }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Créer le dossier des pages d'erreur
  ansible.builtin.file:
    path: "{{ waf_dossier }}/erreurs"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Générer les pages d'erreur personnalisées
  ansible.builtin.template:
    src: erreur.html.j2
    dest: "{{ waf_dossier }}/erreurs/{{ code }}.html"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ waf_erreurs.keys() | list }}"
  loop_control:
    loop_var: code

- name: Déposer les fichiers de la charte (habillage du portail d'authentification)
  ansible.builtin.copy:
    src: charte/
    dest: "{{ waf_dossier }}/charte/"
    owner: root
    group: root
    mode: "u=rwX,go=rX"

- name: Déposer la liste blanche CrowdSec (faux positifs des applications)
  ansible.builtin.template:
    src: crowdsec-liste-blanche.yaml.j2
    dest: "{{ waf_dossier }}/crowdsec-liste-blanche.yaml"
    owner: root
    group: root
    mode: "0644"
  register: waf_liste_blanche

- name: Déposer le fichier Compose de BunkerWeb
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ waf_dossier }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: waf_compose

- name: Démarrer BunkerWeb
  community.docker.docker_compose_v2:
    project_src: "{{ waf_dossier }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if (waf_compose.changed or waf_liste_blanche.changed) else 'auto' }}"
