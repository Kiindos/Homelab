# Source des secrets de la plateforme :
#   sops   : fichier chiffré (SOPS + age) du dépôt privé, déchiffré sur la machine qui lance Ansible ;
#   coffre : coffre OpenBao (moteur « homelab », une entrée par variable, valeur dans le champ « valeur »).
secrets_source: sops
secrets_coffre_adresse: "https://vault.{{ domaine_interne }}:8200"
secrets_coffre_chemin: plateforme
secrets_coffre_moteur: homelab
# Autorité qui a signé le certificat du coffre (vérification TLS).
secrets_coffre_ca: ""
# Connexion au coffre : jeton de la session (VAULT_TOKEN, ex. « bao login -method=oidc » sur le poste d'admin),
# sinon AppRole (VAULT_ROLE_ID et VAULT_SECRET_ID, fournis à Semaphore).
