- name: Déchiffrer les secrets (SOPS + age, sur la machine qui lance Ansible)
  community.sops.load_vars:
    file: "{{ fichier_secrets }}"
  no_log: true
  when: secrets_source == 'sops'

- name: Lire les secrets dans le coffre (OpenBao)
  when: secrets_source == 'coffre'
  delegate_to: localhost
  become: false
  run_once: true
  # Lectures seules : exécutées aussi en mode test (--check), sinon aucune variable ne serait définie.
  check_mode: false
  block:
    - name: Se connecter au coffre par AppRole (sans jeton de session)
      ansible.builtin.uri:
        url: "{{ secrets_coffre_adresse }}/v1/auth/approle/login"
        method: POST
        ca_path: "{{ secrets_coffre_ca }}"
        body_format: json
        body:
          role_id: "{{ lookup('ansible.builtin.env', 'VAULT_ROLE_ID') }}"
          secret_id: "{{ lookup('ansible.builtin.env', 'VAULT_SECRET_ID') }}"
      register: secrets_connexion
      when: lookup('ansible.builtin.env', 'VAULT_TOKEN') | length == 0
      no_log: true

    - name: Retenir le jeton du coffre
      ansible.builtin.set_fact:
        secrets_jeton: >-
          {{ lookup('ansible.builtin.env', 'VAULT_TOKEN') if secrets_connexion is skipped
             else secrets_connexion.json.auth.client_token }}
      no_log: true

    - name: Lister les secrets de la plateforme
      ansible.builtin.uri:
        url: "{{ secrets_coffre_adresse }}/v1/{{ secrets_coffre_moteur }}/metadata/{{ secrets_coffre_chemin }}"
        method: LIST
        ca_path: "{{ secrets_coffre_ca }}"
        headers: { X-Vault-Token: "{{ secrets_jeton }}" }
      register: secrets_liste

    - name: Lire les secrets de la plateforme
      ansible.builtin.uri:
        url: "{{ secrets_coffre_adresse }}/v1/{{ secrets_coffre_moteur }}/data/{{ secrets_coffre_chemin }}/{{ item }}"
        ca_path: "{{ secrets_coffre_ca }}"
        headers: { X-Vault-Token: "{{ secrets_jeton }}" }
      loop: "{{ secrets_liste.json.data['keys'] }}"
      register: secrets_valeurs
      no_log: true

# Hors du bloc « run_once » : chaque machine reçoit les mêmes variables que depuis SOPS.
- name: Définir les variables secrètes
  ansible.builtin.set_fact:
    "{{ item.item }}": "{{ item.json.data.data.valeur }}"
  loop: "{{ secrets_valeurs.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: secrets_source == 'coffre'
  no_log: true
