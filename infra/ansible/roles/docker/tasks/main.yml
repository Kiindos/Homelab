# Docker Engine depuis le dépôt officiel (versions plus récentes que Debian, correctifs plus rapides).
- name: Installer la clé du dépôt Docker
  ansible.builtin.get_url:
    url: "{{ docker_depot }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Déclarer le dépôt Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: {{ docker_depot }}
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    mode: "0644"
  register: docker_sources

- name: Installer Docker et le plugin Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_sources.changed }}"

- name: Configurer le démon Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon | to_nice_json }}\n"
    mode: "0644"
  vars:
    docker_daemon:
      # Journaux bornés : un conteneur bavard ne remplit pas le disque.
      log-driver: json-file
      log-opts: { max-size: "10m", max-file: "3" }
      # Les conteneurs continuent de tourner pendant une mise à jour du démon.
      live-restore: true
  notify: Redémarrer Docker

- name: Autoriser les mises à jour automatiques de Docker (correctifs de sécurité du dépôt officiel)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/53homelab-docker
    content: |
      // Géré par Ansible (rôle docker)
      Unattended-Upgrade::Origins-Pattern { "origin=Docker,label=Docker CE"; };
    mode: "0644"

- name: Démarrer Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
