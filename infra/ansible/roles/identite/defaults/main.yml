identite_dossier: /opt/piles/identite
identite_image_lldap: lldap/lldap:v0.6.3-debian
identite_image_authelia: authelia/authelia:4.39.28
identite_image_valkey: valkey/valkey:9.1.2-alpine
identite_image_comptes: python:3.14.7-alpine3.24
identite_base_dn: "dc={{ domaine_public | split('.') | join(',dc=') }}"
identite_url_portail: "https://auth.{{ domaine_public }}"

# Comptes de service (lecture seule sur l'annuaire) : identifiant => mot de passe (tiré des secrets chiffrés).
# L'inventaire peut en ajouter d'autres.
identite_comptes_service:
  authelia: "{{ authelia.ldap_bind_password }}"

# Comptes de service autorisés à changer les mots de passe des utilisateurs (sauf administrateurs de l'annuaire) :
# Authelia, pour « mot de passe oublié » et les invitations. Les autres restent en lecture seule.
identite_comptes_gestion_mdp: [authelia]
# Validité (en heures) du lien reçu par e-mail pour choisir son mot de passe (oubli ou invitation) ; lien à usage
# unique. Reprise dans le texte des e-mails.
identite_duree_lien_heures: 12
# Sujet de tous les e-mails d'Authelia (les titres fournis par Authelia sont en anglais ; le corps est traduit).
identite_sujet_emails: "[Homelab] Sécurité de votre compte"

identite_groupes: [famille, admins]

# Politiques d'autorisation des clients OpenID Connect : nom => groupes autorisés (double authentification exigée).
# Un client la désigne par « politique ». Ex. : un groupe par service, plus des groupes qui ouvrent tout.
identite_politiques_oidc:
  famille: [famille, admins]
  admins: [admins]
# Attributs calculés à partir des groupes (expressions CEL d'Authelia), exposés aux applications par des claims :
# nom => expression. Ex. : { role_appli: '"admins" in groups ? "admin" : "user"' }
identite_attributs_calcules: {}
# Politiques de claims supplémentaires : nom => { custom_claims: { claim: attribut }, id_token: [claims] }.
identite_politiques_claims: {}
# Portées personnalisées : nom => [claims] (un client doit la demander pour recevoir ces claims).
identite_portees_oidc: {}
# Clients OpenID Connect (le condensat du secret vient des secrets chiffrés) ; « claims » désigne une politique de
# identite_politiques_claims (ou « jeton_id_complet »).
identite_clients_oidc: []
# Sites protégés par le WAF en « auth_request » (sans OpenID Connect) : règles d'accès d'Authelia, dans l'ordre.
# [{ domaine, politique: bypass|one_factor|two_factor, ressources: [regex], sujets: ["group:…"] }]
identite_regles_acces: []

# Page des comptes (inviter un proche, renvoyer un lien) : servie par le proxy interne, qui impose le SSO et transmet
# l'identité (Remote-User, Remote-Groups). Seules les adresses du proxy sont acceptées ; réservée au groupe admins.
identite_page_comptes: false
identite_comptes_port: 8095
identite_comptes_sources: []
# Annonces en cours (bandeau de la page d'accueil, sans donnée personnelle) : adresses autorisées à les lire.
identite_comptes_sources_annonces: []
identite_comptes_groupe_admin: admins
# Groupes proposés à l'invitation : tous ceux de l'annuaire sauf les groupes techniques et ceux-ci (gérés dans
# l'interface de LLDAP) ; descriptions affichées sur la page.
identite_comptes_groupes_exclus: ["{{ identite_comptes_groupe_admin }}"]
identite_comptes_descriptions:
  famille: "Tous les services de la famille"
identite_comptes_lien_annuaire: ""
# Quotas du drive et des photos sur la page des comptes (inactifs si le secret manque) :
# { nextcloud: { url, hote, utilisateur, mot_de_passe }, immich: { url, cle } }. Nextcloud : compte sous-administrateur
# des groupes de la famille ; Immich : clé d'API limitée à la lecture et à la modification des comptes.
identite_comptes_quotas: {}
# E-mail de bienvenue (après l'invitation) : catalogue des services { accueil, portail, services: [{ id, nom, appli,
# url, groupes, description, connexion, etapes, applis }] } ; inactif sans catalogue ou sans SMTP.
identite_comptes_catalogue: {}
identite_comptes_contact: "l'administrateur du homelab"
# Double authentification proposée d'abord à la première connexion : webauthn = clé d'accès (empreinte ou visage du
# téléphone ou de l'ordinateur, sans application) ; totp = application de codes. L'autre reste dans « Méthodes ».
identite_methode_2fa_defaut: webauthn
# Règle des mots de passe (mode « standard » d'Authelia) : chaque exigence manquante est listée en direct, en
# français, pendant la saisie sur la page « choisir son mot de passe ». Le mode zxcvbn n'y montrait qu'une jauge,
# sans dire quoi changer : refus sans explication. Pas de caractère spécial imposé (saisie sur une télécommande).
identite_mots_de_passe:
  longueur_min: 12
  minuscule: true
  majuscule: true
  chiffre: true
  special: false
# La même règle en toutes lettres (e-mails, page d'accueil) : « au moins 12 caractères, dont une minuscule… ».
identite_mdp_exigences: >-
  {{ ['une minuscule' if identite_mots_de_passe.minuscule else '',
      'une majuscule' if identite_mots_de_passe.majuscule else '',
      'un chiffre' if identite_mots_de_passe.chiffre else '',
      'un caractère spécial' if identite_mots_de_passe.special else ''] | select | list }}
identite_regle_mot_de_passe: >-
  au moins {{ identite_mots_de_passe.longueur_min }} caractères{% if identite_mdp_exigences | length > 1 %}, dont
  {{ identite_mdp_exigences[:-1] | join(', ') }} et {{ identite_mdp_exigences[-1] }}{% elif identite_mdp_exigences %},
  dont {{ identite_mdp_exigences[0] }}{% endif %}
