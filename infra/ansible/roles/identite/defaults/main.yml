identite_dossier: /opt/piles/identite
identite_image_lldap: lldap/lldap:v0.6.3-debian
identite_image_authelia: authelia/authelia:4.39.28
identite_image_valkey: valkey/valkey:9.1.2-alpine
identite_image_comptes: python:3.14.7-alpine3.24
identite_base_dn: "dc={{ domaine_public | split('.') | join(',dc=') }}"
identite_url_portail: "https://auth.{{ domaine_public }}"

# Comptes de service (lecture seule sur l'annuaire) : identifiant => mot de passe (tiré des secrets chiffrés).
# L'inventaire peut en ajouter d'autres.
identite_comptes_service:
  authelia: "{{ authelia.ldap_bind_password }}"

# Comptes de service autorisés à changer les mots de passe des utilisateurs (sauf administrateurs de l'annuaire) :
# Authelia, pour « mot de passe oublié » et les invitations. Les autres restent en lecture seule.
identite_comptes_gestion_mdp: [authelia]
# Validité (en heures) du lien reçu par e-mail pour choisir son mot de passe (oubli ou invitation) ; lien à usage
# unique. Reprise dans le texte des e-mails.
identite_duree_lien_heures: 12
# Sujet de tous les e-mails d'Authelia (les titres fournis par Authelia sont en anglais ; le corps est traduit).
identite_sujet_emails: "[Homelab] Sécurité de votre compte"

identite_groupes: [famille, admins]

# Clients OpenID Connect (le condensat du secret vient des secrets chiffrés).
identite_clients_oidc: []
# Sites protégés par le WAF en « auth_request » (sans OpenID Connect) : règles d'accès d'Authelia, dans l'ordre.
# [{ domaine, politique: bypass|one_factor|two_factor, ressources: [regex], sujets: ["group:…"] }]
identite_regles_acces: []

# Page des comptes (inviter un proche, renvoyer un lien) : servie par le proxy interne, qui impose le SSO et transmet
# l'identité (Remote-User, Remote-Groups). Seules les adresses du proxy sont acceptées ; réservée au groupe admins.
identite_page_comptes: false
identite_comptes_port: 8095
identite_comptes_sources: []
identite_comptes_groupe_admin: admins
# Groupes proposés à l'invitation : tous ceux de l'annuaire sauf les groupes techniques et ceux-ci (gérés dans
# l'interface de LLDAP) ; descriptions affichées sur la page.
identite_comptes_groupes_exclus: ["{{ identite_comptes_groupe_admin }}"]
identite_comptes_descriptions:
  famille: "Photos, drive, médias"
identite_comptes_lien_annuaire: ""
