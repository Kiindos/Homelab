# Agents de supervision : métriques système (node_exporter, paquet Debian) et disques (smartctl_exporter).
# La collecte n'est autorisée par le pare-feu que depuis la VM de supervision.
- name: Installer node_exporter (paquet Debian, mises à jour de sécurité automatiques)
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false

- name: Démarrer node_exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true

- name: Exporteur SMART des disques physiques
  when: agent_supervision_smart
  block:
    - name: Installer smartmontools
      ansible.builtin.apt:
        name: smartmontools
        state: present

    - name: Télécharger smartctl_exporter (empreinte SHA-256 vérifiée)
      ansible.builtin.get_url:
        url: "{{ agent_supervision_smart_url }}/smartctl_exporter-{{ agent_supervision_smart_version }}.linux-amd64.tar.gz"
        checksum: "sha256:{{ agent_supervision_smart_url }}/sha256sums.txt"
        dest: "/usr/local/src/smartctl_exporter-{{ agent_supervision_smart_version }}.tar.gz"
        mode: "0644"

    - name: Extraire smartctl_exporter
      ansible.builtin.unarchive:
        src: "/usr/local/src/smartctl_exporter-{{ agent_supervision_smart_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        extra_opts: ["--strip-components=1", "--wildcards", "*/smartctl_exporter"]
        creates: "/usr/local/bin/smartctl_exporter-{{ agent_supervision_smart_version }}.installe"
      notify: Redémarrer smartctl_exporter

    - name: Marquer la version installée
      ansible.builtin.copy:
        dest: "/usr/local/bin/smartctl_exporter-{{ agent_supervision_smart_version }}.installe"
        content: "{{ agent_supervision_smart_version }}\n"
        mode: "0644"

    - name: Déclarer le service smartctl_exporter
      ansible.builtin.template:
        src: smartctl_exporter.service.j2
        dest: /etc/systemd/system/smartctl_exporter.service
        mode: "0644"
      notify: Redémarrer smartctl_exporter

    - name: Démarrer smartctl_exporter
      ansible.builtin.systemd_service:
        name: smartctl_exporter
        state: started
        enabled: true
        daemon_reload: true

# --- Journaux centralisés (ADR 0020) : le journal systemd part vers la supervision, sans agent supplémentaire ---
- name: Envoi du journal vers la supervision
  when: agent_supervision_journaux_url | length > 0
  block:
    - name: Installer systemd-journal-upload (paquet systemd-journal-remote)
      ansible.builtin.apt:
        name: systemd-journal-remote
        state: present
        install_recommends: false

    # Le paquet fournit aussi un récepteur (port 19532) : jamais utilisé ici, donc masqué.
    - name: Masquer le récepteur de journaux, inutile
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: [systemd-journal-remote.socket, systemd-journal-remote.service]

    - name: Créer les dossiers de réglages de l'envoi
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/etc/systemd/journal-upload.conf.d, /etc/systemd/system/systemd-journal-upload.service.d]

    - name: Configurer l'envoi du journal
      ansible.builtin.copy:
        dest: /etc/systemd/journal-upload.conf.d/homelab.conf
        content: |
          # Géré par Ansible (rôle agent_supervision)
          [Upload]
          URL={{ agent_supervision_journaux_url }}
        mode: "0644"
      notify: Redémarrer l'envoi du journal

    # Supervision injoignable (redémarrage, maintenance) : nouvel essai toutes les 30 s, sans abandon ; l'envoi
    # reprend au curseur enregistré, sans trou.
    - name: Relancer l'envoi du journal après une coupure
      ansible.builtin.copy:
        dest: /etc/systemd/system/systemd-journal-upload.service.d/homelab.conf
        content: |
          # Géré par Ansible (rôle agent_supervision)
          [Unit]
          StartLimitIntervalSec=0
          [Service]
          Restart=always
          RestartSec=30s
        mode: "0644"
      notify: Redémarrer l'envoi du journal

    - name: Démarrer l'envoi du journal
      ansible.builtin.systemd_service:
        name: systemd-journal-upload
        state: started
        enabled: true
        daemon_reload: true

# --- État des mises à jour : lu par Prometheus (collecteur textfile), les alertes et la veille de sécurité ---
- name: Relevé de l'état des mises à jour
  when: agent_supervision_etat_mises_a_jour | bool
  block:
    - name: Déposer le script de relevé
      ansible.builtin.copy:
        src: etat-mises-a-jour.py
        dest: /usr/local/sbin/etat-mises-a-jour
        owner: root
        group: root
        mode: "0755"

    - name: Déclarer le service et la minuterie du relevé
      ansible.builtin.copy:
        dest: "/etc/systemd/system/etat-mises-a-jour.{{ item.extension }}"
        content: "{{ item.contenu }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - extension: service
          contenu: |
            # Géré par Ansible (rôle agent_supervision)
            [Unit]
            Description=Relevé de l'état des mises à jour (paquets, redémarrage, conteneurs)
            After=docker.service
            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/etat-mises-a-jour
            Nice=10
            IOSchedulingClass=idle
        - extension: timer
          contenu: |
            # Géré par Ansible (rôle agent_supervision)
            [Unit]
            Description=Relevé horaire de l'état des mises à jour
            [Timer]
            OnBootSec=3min
            OnCalendar=hourly
            RandomizedDelaySec=5min
            [Install]
            WantedBy=timers.target
      loop_control:
        label: "etat-mises-a-jour.{{ item.extension }}"
      register: agent_etat_unites

    - name: Activer la minuterie du relevé
      ansible.builtin.systemd_service:
        name: etat-mises-a-jour.timer
        state: started
        enabled: true
        daemon_reload: "{{ agent_etat_unites is changed }}"

    - name: Premier relevé
      ansible.builtin.systemd_service:
        name: etat-mises-a-jour.service
        state: started
      when: agent_etat_unites is changed

# --- Version d'OPNsense (hyperviseur) : clé limitée au tableau de bord, certificat épinglé ---
- name: Relevé de la version d'OPNsense
  when: agent_supervision_opnsense.cle | default('') | length > 0
  block:
    - name: Créer le dossier de configuration du relevé
      ansible.builtin.file:
        path: /etc/homelab
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Relever le certificat de l'interface d'OPNsense
      ansible.builtin.shell: |
        set -o pipefail
        hote=$(echo '{{ agent_supervision_opnsense.url }}' | sed -E 's#^https://([^/:]+).*#\1#')
        openssl s_client -connect "$hote:443" -servername "$hote" </dev/null 2>/dev/null | openssl x509
      args:
        executable: /bin/bash
      register: agent_opnsense_certificat
      changed_when: false

    - name: Vérifier l'empreinte du certificat (épingle)
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64
      args:
        executable: /bin/bash
        stdin: "{{ agent_opnsense_certificat.stdout }}"
      register: agent_opnsense_empreinte
      changed_when: false
      failed_when: agent_opnsense_empreinte.stdout != agent_supervision_opnsense.epingle

    - name: Déposer le certificat épinglé et la configuration du relevé
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.contenu }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { dest: /etc/homelab/opnsense.pem, contenu: "{{ agent_opnsense_certificat.stdout }}\n" }
        - dest: /etc/homelab/opnsense-veille.json
          contenu: >-
            {{ {'url': agent_supervision_opnsense.url, 'cle': agent_supervision_opnsense.cle,
                'secret': agent_supervision_opnsense.secret, 'certificat': '/etc/homelab/opnsense.pem'} | to_json }}
      loop_control:
        label: "{{ item.dest }}"
      no_log: true
