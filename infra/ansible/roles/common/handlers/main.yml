- name: Recharger SSH
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Redémarrer timesyncd
  ansible.builtin.service:
    name: systemd-timesyncd
    state: restarted

- name: Redémarrer journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Redémarrer resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted

# auditd refuse « systemctl restart » (RefuseManualStop) : rechargement par le script de service.
- name: Redémarrer auditd  # noqa: command-instead-of-module
  ansible.builtin.command: service auditd restart
  changed_when: true

- name: Charger les règles d'audit
  ansible.builtin.command: augenrules --load
  changed_when: true
