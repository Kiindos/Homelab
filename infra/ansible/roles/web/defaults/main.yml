web_dossier: /opt/piles/web
web_image_nginx: nginx:1.30.5-alpine
web_image_cloudflared: cloudflare/cloudflared:2026.9.3
# Sites statiques construits sur le poste d'admin : nom => source, générateur (mkdocs ou hugo), port,
# et éventuellement une politique de sécurité du contenu (en-tête Content-Security-Policy).
web_sites: {}
#  public:  { depot: https://github.com/…/Homelab.git, branche: site-publie, port: 8080, csp: "…", langues: [en] }
#    publié par la CI ; « langues » : sous-dossiers d'un site traduit, chacun avec sa page 404.
#  interne: { source: /chemin/vers/Homelab-interne, generateur: mkdocs, port: 8081 }
#  accueil: { generateur: fichiers, fichiers: accueil, port: 8082, sources_sso: [<WAF>], catalogue: {…} }
#    « fichiers » : dossier du rôle copié tel quel ; « catalogue » : écrit en services.json. Avec « sources_sso », seul
#    le WAF (qui impose le SSO) est accepté, et /moi.json renvoie l'identité et les groupes qu'il transmet.
web_mkdocs: "{{ lookup('env', 'HOME') }}/.local/share/homelab/venv/bin/mkdocs"
web_hugo: "{{ lookup('env', 'HOME') }}/.local/bin/hugo"
# Jeton du tunnel Cloudflare (sortie de la pile OpenTofu cloudflare) : si absent, pas de tunnel.
web_tunnel_token: ""
